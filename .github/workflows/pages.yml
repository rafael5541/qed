name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: build
        run: cargo build --target wasm32-unknown-unknown --release --lib
      - name: bindgen
        run: |
          VER=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VER}/wasm-bindgen-${VER}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          ./wasm-bindgen-${VER}-x86_64-unknown-linux-musl/wasm-bindgen target/wasm32-unknown-unknown/release/qed.wasm --out-dir web/pkg --target no-modules
      - name: stage
        run: |
          mkdir -p dist
          cp -r web examples dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
